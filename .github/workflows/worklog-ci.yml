name: worklog · CI

on:
  pull_request:
    paths:
      - "apps/worklog/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/worklog-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/worklog/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/worklog-ci.yml"

concurrency:
  group: worklog-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/worklog

jobs:
  checks:
    name: Lint, typecheck, unit + component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm --dir ../.. format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration tests (Postgres via Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: worklog
          POSTGRES_PASSWORD: worklog
          POSTGRES_DB: worklog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U worklog"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://worklog:worklog@localhost:5432/worklog
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0000
      AUTH_TEST_LOGIN_SECRET: ci-test-login-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/worklog/playwright-report
          retention-days: 7
