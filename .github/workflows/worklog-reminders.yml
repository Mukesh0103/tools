name: worklog · Hourly sync and reminders

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    if: vars.WORKLOG_APP_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ vars.WORKLOG_APP_URL }}
      CRON_SECRET: ${{ secrets.WORKLOG_CRON_SECRET }}
    steps:
      # First, so imported pull requests and issue moves count as logged work.
      - name: Import GitHub and Jira activity
        continue-on-error: true
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/sync"
      - name: Send due reminders
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/reminders"
